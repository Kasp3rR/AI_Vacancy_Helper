name: ai-vacancy-helper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhelper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhelper}
      POSTGRES_DB: ${POSTGRES_DB:-jobhelper}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobhelper}:${POSTGRES_PASSWORD:-jobhelper}@postgres:5432/${POSTGRES_DB:-jobhelper}
      REDIS_URL: redis://redis:6379/0
      APP_NAME: ${APP_NAME:-AI Vacancy Helper}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app_environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

[project]
name = "ai-vacancy-helper"
version = "0.1.0"
description = "Resume analysis and deterministic hh.ru recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5,<7", "httpx>=0.27,<1",
  "pyjwt>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "pymupdf>=1.24,<2",
  "python-multipart>=0.0.18", "email-validator>=2.2,<3", "tenacity>=9,<10"
]
[dependency-groups]
dev = [
  "pytest>=8,<9", "pytest-cov>=5,<7", "pytest-mock>=3,<4",
  "fakeredis>=2,<3", "respx>=0.21,<1", "ruff>=0.9", "mypy>=1.14,<2", "pre-commit>=4,<5"
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = ["integration: requires a disposable PostgreSQL database via TEST_DATABASE_URL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["pymupdf.*"]
ignore_missing_imports = true
